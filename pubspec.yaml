name: langarseva
description: "LangarSeva - find free community kitchens (langars) near you, see timings, volunteer and donate."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  supabase_flutter: ^2.9.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  google_maps_flutter: ^2.12.0
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^7.0.1
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#F57C00"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"

flutter_native_splash:
  color: "#F57C00"
  image: assets/branding/splash.png
  android_12:
    color: "#F57C00"
    image: assets/branding/splash.png
