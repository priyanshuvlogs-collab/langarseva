name: Android

on:
  push:
    branches: ['**']
  pull_request:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://pbjfpahqtvearfvcuogj.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_hYY0MyoXrTx_SFyy5x_NFg_lcKdWcXf' }}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage

  live-api:
    name: Live backend smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise every query the app sends against the live Supabase project
        run: scripts/live_api_smoke.sh

  build-debug:
    name: Debug APK (sideload)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY_ANDROID }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: langarseva-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  build-release:
    name: Release AAB (Play Store)
    runs-on: ubuntu-latest
    needs: check
    # Only on main or a release tag, and only when signing secrets are configured.
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.RELEASE_SIGNING == 'true'
    env:
      # Secrets cannot be read in `if:`; expose whether the Play key exists.
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          cache: true
      - run: flutter pub get
      - name: Restore and validate upload keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: scripts/restore_keystore.sh
      - name: Build AAB
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY_ANDROID }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: langarseva-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
      # Google Play only accepts API uploads after the first AAB was uploaded by
      # hand in Play Console, and only as drafts until the app is published.
      # Without the service account the signed AAB stays available as an artifact.
      - name: Upload to Play internal track
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_PLAY_SA == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.langarseva.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
